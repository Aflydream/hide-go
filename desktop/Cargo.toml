[package]
name = "hide-go-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hide-Go Cross-Platform Desktop AI Harness Privacy Firewall (Linux, macOS, Windows)"

[lib]
name = "hide_go_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
hide-core = { path = "../crates/hide-core" }
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
# Enable `tauri-gui` when building native desktop bundle with system WebKit/WebView2 libraries installed
tauri-gui = []
