[package]
name = "hide-setup"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hide-Go interactive setup wizard, installer, and uninstaller"

[[bin]]
name = "hide-go-setup"
path = "src/main.rs"

[dependencies]
hide-chrome = { path = "../hide-chrome" }
hide-engine = { path = "../hide-engine" }

[build-dependencies]
ring = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
