[workspace]
members = [
    "crates/hide-chrome",
    "crates/hide-core",
    "crates/hide-daemon",
    "crates/hide-engine",
    "crates/hide-launcher",
    "crates/hide-setup",
    "desktop",
]
resolver = "2"

[workspace.package]
version = "0.3.6"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "deflate", "brotli", "http2"] }
flate2 = "1.0"
regex = "1.10"
once_cell = "1.19"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
bytes = "1.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
parking_lot = "0.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1.15"
ring = "0.17"
hyper = { version = "1.12", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "service", "tokio", "http1", "http2"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
webpki-roots = "1.0"
tao = "0.37"
wry = "0.57"
libloading = "0.8"
tar = "0.4"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
