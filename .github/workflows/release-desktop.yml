name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build frontend (type-check + bundle)
        run: |
          npm ci
          npm run build
      - name: Verify committed dist/ matches sources
        run: git diff --exit-code -- dist
      - name: Install Linux WebView dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: hide-go-desktop
            daemon_bin_name: hide-go-daemon
            setup_bin_name: hide-go-setup
            setup_entry_name: Hide-Go-Setup
            package_dir: Hide-Go-Setup-linux-x86_64
            archive_name: Hide-Go-Setup-linux-x86_64.tar.gz
            archive_format: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: hide-go-desktop
            daemon_bin_name: hide-go-daemon
            setup_bin_name: hide-go-setup
            setup_entry_name: Hide-Go-Setup
            package_dir: Hide-Go-Setup-macos-arm64
            archive_name: Hide-Go-Setup-macos-arm64.tar.gz
            archive_format: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: hide-go-desktop.exe
            daemon_bin_name: hide-go-daemon.exe
            setup_bin_name: hide-go-setup.exe
            setup_entry_name: Hide-Go-Setup.exe
            package_dir: Hide-Go-Setup-windows-x64
            archive_name: Hide-Go-Setup-windows-x64.zip
            archive_format: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux WebView dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Build desktop, daemon, and setup binaries
        run: cargo build --release --locked -p hide-core -p hide-go-desktop -p hide-setup --target ${{ matrix.target }}
      - name: Package setup archive and checksum
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          test -n "${VERSION}"

          PKG_DIR="${{ matrix.package_dir }}"
          ARCHIVE="${{ matrix.archive_name }}"
          TARGET_DIR="target/${{ matrix.target }}/release"

          rm -rf "${PKG_DIR}" "${ARCHIVE}" "${ARCHIVE}.sha256"
          mkdir -p "${PKG_DIR}/payload"

          cp "${TARGET_DIR}/${{ matrix.setup_bin_name }}" "${PKG_DIR}/${{ matrix.setup_entry_name }}"
          cp "${TARGET_DIR}/${{ matrix.bin_name }}" "${PKG_DIR}/payload/${{ matrix.bin_name }}"
          cp "${TARGET_DIR}/${{ matrix.daemon_bin_name }}" "${PKG_DIR}/payload/${{ matrix.daemon_bin_name }}"
          cp "desktop/icons/icon.ico" "${PKG_DIR}/payload/icon.ico"
          cp "desktop/icons/icon.png" "${PKG_DIR}/payload/icon.png"

          if [ "${{ matrix.archive_format }}" = "tar.gz" ]; then
            chmod +x "${PKG_DIR}/${{ matrix.setup_entry_name }}" \
              "${PKG_DIR}/payload/${{ matrix.bin_name }}" \
              "${PKG_DIR}/payload/${{ matrix.daemon_bin_name }}"
          fi

          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | awk '{print $1}'
            else
              shasum -a 256 "$1" | awk '{print $1}'
            fi
          }

          DESKTOP_SHA=$(sha256_of "${PKG_DIR}/payload/${{ matrix.bin_name }}")
          DAEMON_SHA=$(sha256_of "${PKG_DIR}/payload/${{ matrix.daemon_bin_name }}")
          ICO_SHA=$(sha256_of "${PKG_DIR}/payload/icon.ico")
          PNG_SHA=$(sha256_of "${PKG_DIR}/payload/icon.png")

          cat > "${PKG_DIR}/payload/payload-manifest.json" <<EOF
          {
            "version": "${VERSION}",
            "files": {
              "${{ matrix.bin_name }}": "${DESKTOP_SHA}",
              "${{ matrix.daemon_bin_name }}": "${DAEMON_SHA}",
              "icon.ico": "${ICO_SHA}",
              "icon.png": "${PNG_SHA}"
            }
          }
          EOF

          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            powershell.exe -NoProfile -NonInteractive -Command "Compress-Archive -Path '${PKG_DIR}' -DestinationPath '${ARCHIVE}' -CompressionLevel Optimal -Force"
          else
            COPYFILE_DISABLE=1 tar -czf "${ARCHIVE}" "${PKG_DIR}"
          fi

          ARCHIVE_SHA=$(sha256_of "${ARCHIVE}")
          printf "%s  %s\n" "${ARCHIVE_SHA}" "${ARCHIVE}" > "${ARCHIVE}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_dir }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  release:
    # Releases are cut only from version tags, so every binary matches its tagged source.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            { sub(/\r$/, "") }
            index($0, "## [" ver "]") == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Hide-Go ${GITHUB_REF_NAME}" > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hide-Go ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
