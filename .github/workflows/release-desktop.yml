name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build frontend (type-check + bundle)
        run: |
          npm ci
          npm run build
      - name: Verify committed dist/ matches sources
        run: git diff --exit-code -- dist
      - name: Install Linux WebView dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pkg_os: linux
            target: x86_64-unknown-linux-gnu
            artifact_group: Hide-Go-Setup-linux-x86_64
            artifact_name: Hide-Go-Setup-linux-x86_64.tar.gz
            artifact_format: tar.gz
          - os: macos-latest
            pkg_os: macos
            target: aarch64-apple-darwin
            artifact_group: Hide-Go-Setup-macos-arm64
            artifact_name: Hide-Go-Setup-macos-arm64.tar.gz
            artifact_format: tar.gz
          - os: windows-latest
            pkg_os: windows
            target: x86_64-pc-windows-msvc
            artifact_group: Hide-Go-Setup-windows-x64
            artifact_name: Hide-Go-Setup-windows-x64.exe
            artifact_format: exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux WebView dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Build shared runtime libraries and launchers
        run: cargo build --release --locked -p hide-chrome -p hide-engine -p hide-go-desktop -p hide-daemon --target ${{ matrix.target }}
      - name: Sign Windows runtime binaries
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found on Windows runner" }
          $pfxPath = Join-Path $env:RUNNER_TEMP "hide-go-cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          try {
            $relDir = "target/${{ matrix.target }}/release"
            $targets = @(
              (Join-Path $relDir "hide_chrome.dll"),
              (Join-Path $relDir "hide_engine.dll"),
              (Join-Path $relDir "hide-go-desktop.exe"),
              (Join-Path $relDir "hide-go-daemon.exe")
            )
            foreach ($f in $targets) {
              if (-not (Test-Path $f)) { throw "Missing binary to sign: $f" }
              if ($env:WINDOWS_CERT_PASSWORD) {
                & $signtool sign /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f
              } else {
                & $signtool sign /f $pfxPath /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $f
              }
              if ($LASTEXITCODE -ne 0) { throw "signtool failed for $f with exit code $LASTEXITCODE" }
            }
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }
      - name: Stage embedded payload archive
        run: node scripts/package-setup.mjs --mode stage-payload --os "${{ matrix.pkg_os }}" --target "${{ matrix.target }}" --out "target/pkg/app-${{ matrix.pkg_os }}.tar.gz"
      - name: Build standalone installer
        env:
          HIDE_GO_EMBED_PAYLOAD_ARCHIVE: target/pkg/app-${{ matrix.pkg_os }}.tar.gz
        run: cargo build --release --locked -p hide-setup --target ${{ matrix.target }}
      - name: Package setup release artifact and checksum
        run: node scripts/package-setup.mjs --mode release-setup --os "${{ matrix.pkg_os }}" --target "${{ matrix.target }}" --out "${{ matrix.artifact_name }}" --format "${{ matrix.artifact_format }}"
      - name: Sign Windows standalone installer and refresh checksum
        if: matrix.os == 'windows-latest' && env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found on Windows runner" }
          $pfxPath = Join-Path $env:RUNNER_TEMP "hide-go-cert.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          try {
            $exe = "${{ matrix.artifact_name }}"
            if ($env:WINDOWS_CERT_PASSWORD) {
              & $signtool sign /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
            } else {
              & $signtool sign /f $pfxPath /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $exe
            }
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $exe with exit code $LASTEXITCODE" }
            $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
            [IO.File]::WriteAllText("$exe.sha256", "$hash  $exe`n", (New-Object System.Text.UTF8Encoding($false)))
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_group }}
          path: |
            ${{ matrix.artifact_name }}
            ${{ matrix.artifact_name }}.sha256

  release:
    # Releases are cut only from version tags, so every binary matches its tagged source.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            { sub(/\r$/, "") }
            index($0, "## [" ver "]") == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Hide-Go ${GITHUB_REF_NAME}" > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hide-Go ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
