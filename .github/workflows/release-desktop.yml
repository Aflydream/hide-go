name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build frontend (type-check + bundle)
        run: |
          npm ci
          npm run build
      - name: Verify committed dist/ matches sources
        run: git diff --exit-code -- dist
      - name: Install Linux WebView dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pkg_os: linux
            target: x86_64-unknown-linux-gnu
            package_dir: Hide-Go-Setup-linux-x86_64
            archive_name: Hide-Go-Setup-linux-x86_64.tar.gz
            archive_format: tar.gz
          - os: macos-latest
            pkg_os: macos
            target: aarch64-apple-darwin
            package_dir: Hide-Go-Setup-macos-arm64
            archive_name: Hide-Go-Setup-macos-arm64.tar.gz
            archive_format: tar.gz
          - os: windows-latest
            pkg_os: windows
            target: x86_64-pc-windows-msvc
            package_dir: Hide-Go-Setup-windows-x64
            archive_name: Hide-Go-Setup-windows-x64.zip
            archive_format: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux WebView dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libxdo-dev
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Build shared runtime libraries and launchers
        run: cargo build --release --locked -p hide-chrome -p hide-engine -p hide-go-desktop -p hide-daemon -p hide-setup --target ${{ matrix.target }}
      - name: Package setup archive and checksum
        run: node scripts/package-setup.mjs --target "${{ matrix.target }}" --os "${{ matrix.pkg_os }}" --package-dir "${{ matrix.package_dir }}" --archive "${{ matrix.archive_name }}" --format "${{ matrix.archive_format }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package_dir }}
          path: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256

  release:
    # Releases are cut only from version tags, so every binary matches its tagged source.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            { sub(/\r$/, "") }
            index($0, "## [" ver "]") == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Hide-Go ${GITHUB_REF_NAME}" > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Hide-Go ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
